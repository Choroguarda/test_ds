<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body class="container mt-5">
    <h2 class="text-center">Lista de Usuarios</h2>
    <table class="table table-bordered mt-3">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Email</th>
                <th>Avatar</th>
            </tr>
        </thead>
        <tbody id="tabla-usuarios">
            
        </tbody>
    </table>

    <script>
        $(document).ready(function () {
            //obtengo la  url creada en routes.php  y cargo los datos de la vista
            $.getJSON("http://localhost:8000/listarUsuarios", function (data) {
                let filas = "";
                data.forEach(user => {
                    filas += `
                        <tr>
                            <td>${user.id}</td>
                            <td>${user.first_name} ${user.last_name}</td>
                            <td>${user.email}</td>
                            <td><img src="${user.avatar}" width="50" class="rounded-circle"></td>
                        </tr>
                    `;
                });
                $("#tabla-usuarios").html(filas);
            });
        });
    </script>
</body>
</html>
